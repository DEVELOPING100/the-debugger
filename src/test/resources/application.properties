# Test settings: an in-memory H2 database, so tests never touch the shared
# Neon database and run on any machine without the DB_* environment variables.
spring.application.name=Labline

spring.datasource.url=jdbc:h2:mem:labline;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Build the tables from the entity classes for each test run
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

labline.auth.allowed-email-domain=unb.ca
labline.queue.max-description-length=300
labline.grouping.url=http://localhost:5999
