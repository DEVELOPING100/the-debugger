spring.application.name=Labline

# Database (values come from Windows environment variables, never commit real passwords)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Check that Java classes match the tables; never change the tables
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# LabLine settings
labline.auth.allowed-email-domain=unb.ca
labline.queue.max-description-length=300

# Flask question-grouping service (SCRUM-10); falls back to an ungrouped queue if it is down
labline.grouping.url=${GROUPING_URL:http://localhost:5000}
