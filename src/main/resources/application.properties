spring.application.name=Labline

# Database (values come from Windows environment variables, never commit real passwords)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Check that Java classes match the tables; never change the tables
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# LabLine settings
labline.auth.allowed-email-domain=unb.ca
labline.queue.max-description-length=300